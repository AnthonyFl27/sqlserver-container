services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver-2025
    # restart: unless-stopped
    restart: "no" # temporal
    environment:
      ACCEPT_EULA: "Y"
      #MSSQL_PID: "${MSSQL_PID}"                   # sqlversion
      #MSSQL_LICENSE_KEY: "${MSSQL_LICENSE_KEY}"   # license key
      SA_PASSWORD: "${SA_PASSWORD}" # sa password
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}" # new user password
      MSSQL_DATA_DIR: /var/opt/mssql/user_data
      MSSQL_LOG_DIR: /var/opt/mssql/user_logs
      MSSQL_BACKUP_DIR: /var/opt/mssql/backups
    ports:
      - "3314:1433" # port
    volumes:
      - ./mssql_system:/var/opt/mssql/data # master, model, msdb, tempdb
      - ./mssql_user_data:/var/opt/mssql/user_data # .mdf clientes
      - ./mssql_user_logs:/var/opt/mssql/user_logs # .ldf clientes
      - ./backups:/var/opt/mssql/backups # backups
    mem_limit: 4g
    mem_reservation: 2g
    cpus: "2.0"
    shm_size: "512m"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U mssql_admin -P 'Auth_2702#SQL_Dev!' -C",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
